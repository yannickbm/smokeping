name: Build SmokePing image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-image.yml'
  # elke maandag opnieuw bouwen zodat apt-security-updates meekomen
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # wil je ook ARM (bv. Oracle Ampere node)? maak hier:
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          tags: |
            ghcr.io/yannickbm/smokeping:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
